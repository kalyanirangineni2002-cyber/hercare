{% extends 'base.html' %}
{% load static %}

{% block guest_content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-card shadow-lg p-5" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="text-secondary small">Access your personalized health dashboard</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger bg-transparent border-danger text-danger small mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label small text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-glass);"><i class="fas fa-user text-secondary"></i></span>
                    <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Enter username" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-glass);"><i class="fas fa-lock text-secondary"></i></span>
                    <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Enter password" required>
                </div>
            </div>
            
            <button type="submit" class="btn-premium w-100 py-3 mb-3">
                Log In <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="small text-secondary mb-0">Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
